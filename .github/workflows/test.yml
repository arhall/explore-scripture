name: Bible Explorer Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        python-version: [3.9, 3.11]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Fetch datasets
        run: ./scripts/fetch-datasets.sh

      - name: Build site
        run: npm run build

      - name: Setup Chrome for testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # latest
        with:
          chrome-version: stable

      - name: Create Python virtual environment
        run: |
          python -m venv test-env
          source test-env/bin/activate
          pip install -r tests/requirements.txt

      - name: Run coverage (Jest + pytest)
        if: ${{ matrix.node-version == '24.x' && matrix.python-version == '3.11' }}
        run: |
          npm run test:coverage
          source test-env/bin/activate
          pytest tests/test_env_config.py \
            --cov=tests \
            --cov-report=xml:coverage.xml \
            -q

      - name: Start development server
        run: |
          npm run dev &
          sleep 10
          curl -f http://localhost:8080 || exit 1

      - name: Run Selenium tests
        run: |
          source test-env/bin/activate
          python -m pytest tests/ \
            --html=test_report.html \
            --self-contained-html \
            -v \
            --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-report-node${{ matrix.node-version }}-py${{ matrix.python-version }}
          path: test_report.html

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && hashFiles('screenshots/**') != ''
        with:
          name: screenshots-node${{ matrix.node-version }}-py${{ matrix.python-version }}
          path: screenshots/

      - name: Upload coverage to Codecov
        if: ${{ always() && matrix.node-version == '24.x' && matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage/lcov.info,./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
